plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.115'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenLocal()
    maven {
        name = 'BlameJared (JEI)'
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        name = 'Modrinth (Create, EMI for dev runs)'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'Create (Ponder, Flywheel, Create)'
        url = 'https://maven.createmod.net'
        content { includeGroup 'net.createmod.ponder'; includeGroup 'com.simibubi.create'; includeGroup 'dev.engine-room.flywheel' }
    }
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Ponder ships inside Create 6; compile against its API only.
    compileOnly("net.createmod.ponder:ponder-neoforge:${ponder_version}") { transitive = false }
    // Create itself (slim jar, nothing transitive) for ConnectivityHandler, BoilerHeater, belts, arms, goggles.
    compileOnly("com.simibubi.create:create-${minecraft_version}:${create_maven_version}:slim") { transitive = false }
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}") { transitive = false }
    // JEI API for our recipe categories (optional at runtime).
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"

    // Dev runs only (runClient / runServer / runGameTestServer): never shipped, never a dependency of the jar.
    // Create's Modrinth jar bundles Ponder, Flywheel and Registrate, so it's the only required mod.
    localRuntime "maven.modrinth:create:${create_runtime_version}"
    // Recipe viewer for dev runs: dev_recipe_viewer = jei, emi or none (gradle.properties, or -Pdev_recipe_viewer=emi).
    if (project.dev_recipe_viewer == 'jei') {
        localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    } else if (project.dev_recipe_viewer == 'emi') {
        localRuntime "maven.modrinth:emi:${emi_version}+neoforge"
    }
}

neoForge {
    version = project.neo_version

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // ./gradlew runGameTestServer: headless server, runs the playtests, exits. Kragnoth runs this, not Claude.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            create_version_range   : create_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    // Game tests and their template are for dev runs only.
    exclude 'com/kragnoth/creativeengineering/gametest/**', 'data/creativeengineering/structure/gametest/**'
}
